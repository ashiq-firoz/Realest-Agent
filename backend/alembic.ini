# Alembic configuration file.
# The sqlalchemy.url is intentionally left blank here —
# it is overridden at runtime in alembic/env.py using the async engine
# configured via app.config.Settings.

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for the generated migration timestamp (UTC recommended)
timezone = UTC

# Max length of the slug derived from the revision message
truncate_slug_length = 40

# Revision identifiers used by "alembic revision"
revision_environment = false

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = true

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Leave sqlalchemy.url blank — set programmatically in env.py
sqlalchemy.url =
